<!doctype html><html><head><meta charset="utf-8"><title>Sample App</title>
<style>body{font-family:Arial;margin:60px;background:#f4f6fb}h1{font-size:56px}
input{font-size:28px;padding:12px;width:520px}button{font-size:28px;padding:12px 28px;margin-left:12px}
#out{font-size:34px;margin-top:30px;color:#0a7a3d}.filler{height:1400px;font-size:30px;margin-top:80px}</style></head>
<body><h1>Lead Capture Demo</h1>
<input id="q" placeholder="Type your enquiry"><button id="go">Send</button>
<div id="out"></div><div class="filler">Scroll area: more content below.<br><br><b id="end">Bottom reached.</b></div>
<script>go.onclick=()=>{out.textContent='Lead saved: '+q.value}</script></body></html>
